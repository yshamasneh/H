name: Deploy Vercel

on:
  push:
    branches:
      - agent/phase-15-and-jovo-brand
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-vercel
  cancel-in-progress: true

jobs:
  wait-for-release-gates:
    name: Wait for Release gates to pass
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Production must only ever move forward to the tip of the release branch. A manual dispatch on
      # another ref, or a re-run of an older run after newer commits landed, would otherwise redeploy
      # stale code over newer code while reporting success.
      - name: Refuse anything but the current tip of the release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" != "refs/heads/agent/phase-15-and-jovo-brand" ]]; then
            echo "::error::Vercel production deploys only from agent/phase-15-and-jovo-brand, not ${{ github.ref }}."
            exit 1
          fi
          tip=$(gh api "repos/${{ github.repository }}/commits/agent/phase-15-and-jovo-brand" --jq .sha)
          if [[ "$tip" != "${{ github.sha }}" ]]; then
            echo "::error::${{ github.sha }} is no longer the branch tip ($tip); refusing to deploy a superseded commit."
            exit 1
          fi
      # A revoked or expired token otherwise only surfaces after the (up to 30 min) gate wait. This
      # asks for the two projects the deploy jobs use, so a team-scoped token passes exactly when it
      # can deploy (a user-level endpoint like /v2/user can refuse a team-scoped token).
      - name: Check the Vercel token can reach both projects
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          PROJECT_IDS: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }} ${{ secrets.VERCEL_PROJECT_ID_MOBILE_WEB }}
        run: |
          set -euo pipefail
          for project in $PROJECT_IDS; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/$project?teamId=$VERCEL_ORG_ID")
            if [[ "$status" != "200" ]]; then
              echo "::error::Vercel refused VERCEL_TOKEN for a deploy project (HTTP $status). Create a token scoped to the project's team at https://vercel.com/account/tokens and run: gh secret set VERCEL_TOKEN"
              exit 1
            fi
          done
      - name: Poll for this commit's Release gates result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          repo="${{ github.repository }}"
          echo "Waiting for the 'Release gates' workflow to finish for $sha"
          for attempt in $(seq 1 120); do
            run_json=$(gh api "repos/$repo/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&per_page=1" --jq '.workflow_runs[0] // empty')
            if [[ -n "$run_json" ]]; then
              status=$(jq -r '.status' <<<"$run_json")
              if [[ "$status" == "completed" ]]; then
                conclusion=$(jq -r '.conclusion' <<<"$run_json")
                echo "Release gates concluded: $conclusion"
                if [[ "$conclusion" == "success" ]]; then
                  exit 0
                fi
                echo "::error::Release gates did not succeed ($conclusion); refusing to deploy to Vercel."
                exit 1
              fi
            fi
            sleep 15
          done
          echo "::error::Timed out waiting for Release gates to complete"
          exit 1

  deploy-vercel-admin:
    name: Deploy admin console (Vercel)
    needs: wait-for-release-gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: vercel-admin
      url: https://jovo-admin.vercel.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
      - name: Deploy prebuilt output
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
      # "Deployed" is not proof: confirm the production alias now resolves to a deployment of this commit.
      - name: Verify production serves this commit
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            live=$(curl --fail --silent --show-error --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/jovo-admin.vercel.app?teamId=$VERCEL_ORG_ID" | jq -r '.meta.githubCommitSha // empty')
            if [[ "$live" == "$GITHUB_SHA" ]]; then
              echo "jovo-admin.vercel.app serves $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "::error::jovo-admin.vercel.app still serves ${live:-an unknown commit}, expected $GITHUB_SHA"
          exit 1
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

  deploy-vercel-mobile-web:
    name: Deploy JOVO web export (Vercel)
    needs: wait-for-release-gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: vercel-mobile-web
      # Project is named jovo-market-web, but jovo-market-web.vercel.app is still
      # held by Khaldoun's old (different-account) project of the same name, so
      # Vercel fell back to this project's original working alias. Update this
      # once that name is freed up and re-aliased (see report).
      url: https://h-admin-gray.vercel.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_MOBILE_WEB }}
      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_MOBILE_WEB }}
      - name: Deploy prebuilt output
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_MOBILE_WEB }}
      # "Deployed" is not proof: confirm the production alias now resolves to a deployment of this commit.
      - name: Verify production serves this commit
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            live=$(curl --fail --silent --show-error --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/h-admin-gray.vercel.app?teamId=$VERCEL_ORG_ID" | jq -r '.meta.githubCommitSha // empty')
            if [[ "$live" == "$GITHUB_SHA" ]]; then
              echo "h-admin-gray.vercel.app serves $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "::error::h-admin-gray.vercel.app still serves ${live:-an unknown commit}, expected $GITHUB_SHA"
          exit 1
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
